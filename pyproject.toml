[project]
name = "tarea4-bcrp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4,<5",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["mcp"]
pythonpath = ["mcp"]
